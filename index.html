                "Соловьев Иван Петрович": { "10": { "1": "н", "2": "н", "3": "н", "4": "н", "5": "н", "6": "н" }, "20": { "1": "н", "2": "н", "3": "н", "4": "н", "5": "н", "6": "н", "7": "н" }, "21": { "1": "н", "2": "н", "3": "н", "4": "н" } },
                "Вакула Савелий Романович": { "11": { "1": "с", "2": "с", "3": "с", "4": "с", "5": "с" }, "12": { "1": "с", "2": "с", "3": "с", "4": "с", "5": "с", "6": "с" }, "13": { "1": "с", "2": "с", "3": "с", "4": "с", "5": "с", "6": "с", "7": "с" }, "14": { "1": "с", "2": "с", "3": "с", "4": "с" }, "16": { "1": "с", "3": "с", "4": "с", "5": "с", "6": "с", "7": "с" } },
                "Шандалович Николай Михайлович": { "2": { "1": "н", "3": "н", "4": "н", "5": "н", "6": "н", "7": "н" }, "4": { "4": "н", "5": "н", "6": "н" }, "6": { "2": "н" }, "16": { "1": "с", "3": "с", "4": "с", "5": "с", "6": "с", "7": "с" } },
                "Пекач Кирилл Ильич": { "4": { "1": "н" } },
                "Демиденко Данил Игоревич": { "4": { "4": "н" } },
                "Губарик Артём Русланович": { "5": { "3": "н", "4": "н" }, "17": { "1": "н", "2": "н", "3": "н", "4": "н" }, "20": { "7": "н" } },
                "Трус Игнат Николаевич": { "5": { "3": "н", "4": "н" }, "20": { "7": "н" } },
                "Чопко Владислав Владимирович": { "5": { "4": "н" }, "11": { "1": "н", "2": "н", "5": "н" } },
                "Четырбок Иван Александрович": { "18": { "1": "н", "2": "н", "3": "н", "4": "н", "5": "н", "6": "н", "7": "н" } },
                "Янушкевич Максим Андреевич": { "6": { "2": "н" } },
                "Мазовецкий Иван Дмитриевич": { "4": { "7": "н", "8": "н" }, "11": { "4": "с" } },
                "Крылов Максим Дмитриевич": { "17": { "3": "н", "4": "н" }, "18": { "5": "н", "6": "н" } },
                "Казмерчук Иван Андреевич": { "18": { "5": "н", "6": "н" } },
                "Хомук Богдан Владимирович": { "11": { "5": "н" } }
            }
        }
    };

    // ========================================================
    // ЛОГИКА РАБОТЫ САЙТА
    // ========================================================
    const select = document.getElementById('studentSelect');
    const tabsMenu = document.getElementById('tabsMenu');
    const btnGrades = document.getElementById('btnGrades');
    const btnAbsences = document.getElementById('btnAbsences');
    const sectionGrades = document.getElementById('sectionGrades');
    const sectionAbsences = document.getElementById('sectionAbsences');
    const tbody = document.getElementById('gradesBody');
    const absencesContent = document.getElementById('absencesContent');
    const absenceMonthSelect = document.getElementById('absenceMonthSelect');

    studentsData.forEach((student, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = student.name;
        select.appendChild(option);
    });

    function renderAbsences(studentName, monthKey) {
        absencesContent.innerHTML = '';
        
        const monthData = absencesData[monthKey];
        if (!monthData) {
            absencesContent.innerHTML = '<p class="empty" style="text-align:center; padding: 20px;">Данные за этот месяц отсутствуют.</p>';
            return;
        }

        const studentAbsences = monthData.marks[studentName];
        
        if (!studentAbsences) {
            absencesContent.innerHTML = '<p class="empty" style="text-align:center; padding: 20px;">Пропусков за этот месяц не зафиксировано.</p>';
            return;
        }

        let stats = { total: 0, invalid: 0, valid: 0 };
        let absencesList = [];

        for (const [day, hours] of Object.entries(studentAbsences)) {
            // Группируем по парам (1 или 2 часа)
            let pairsMap = {};
            for (const [hour, reason] of Object.entries(hours)) {
                const pairNum = Math.ceil(parseInt(hour) / 2);
                if (!pairsMap[pairNum]) {
                    pairsMap[pairNum] = { hoursCount: 0, reason: reason };
                }
                pairsMap[pairNum].hoursCount++;
            }

            for (const [pairNum, data] of Object.entries(pairsMap)) {
                stats.total += data.hoursCount;
                if (data.reason === 'н') {
                    stats.invalid += data.hoursCount;
                } else {
                    stats.valid += data.hoursCount;
                }

                const subjectKey = `${day}_${pairNum}`;
                const subjectName = monthData.subjects[subjectKey] || "Неизвестный предмет";

                absencesList.push({
                    day: parseInt(day),
                    pair: parseInt(pairNum),
                    hoursCount: data.hoursCount,
                    reason: data.reason,
                    subject: subjectName
                });
            }
        }

        absencesList.sort((a, b) => {
            if (a.day !== b.day) return a.day - b.day;
            return a.pair - b.pair;
        });

        let html = `
            <div class="absence-summary">
                <div class="absence-card card-valid">
                    <div class="label">Уважительные</div>
                    <div class="value">${stats.valid}</div>
                </div>
                <div class="absence-card card-invalid">
                    <div class="label">Неуважительные</div>
                    <div class="value">${stats.invalid}</div>
                </div>
                <div class="absence-card card-total">
                    <div class="label">Всего часов</div>
                    <div class="value">${stats.total}</div>
                </div>
            </div>
            <div class="absence-details">
                <h3>Детали пропусков</h3>
                <ul class="absence-list">
        `;

        absencesList.forEach(item => {
            const reasonClass = item.reason === 'н' ? 'reason-н' : 'reason-other';
            let reasonText = item.reason;
            if (item.reason === 'н') reasonText = 'Неуважительная';
            else if (item.reason === 'с') reasonText = 'Справка';
            else if (item.reason === 'п') reasonText = 'Повестка';
            else if (item.reason === 'д') reasonText = 'Дежурство';
            else if (item.reason === 'з') reasonText = 'Заявление';
            else if (item.reason === 'пр') reasonText = 'Приказ';
            else if (item.reason === 'в') reasonText = 'Вождение';
            
            let monthName = "Ноябрь"; 
            let hoursStr = item.hoursCount === 1 ? '1 час' : '2 часа';

            html += `
                <li>
                    <span class="absence-date">${item.day} ${monthName.toLowerCase()}</span>
                    <span class="absence-subject">${item.subject} (${hoursStr})</span>
                    <span class="absence-reason ${reasonClass}">${reasonText}</span>
                </li>
            `;
        });

        html += `
                </ul>
            </div>
        `;

        absencesContent.innerHTML = html;
    }

    select.addEventListener('change', function() {
        const selectedIndex = this.value;
        
        if (selectedIndex === "") {
            tabsMenu.style.display = 'none';
            sectionGrades.style.display = 'none';
            sectionAbsences.style.display = 'none';
            return;
        }

        tabsMenu.style.display = 'flex';
        switchTab('grades'); 

        const student = studentsData[selectedIndex];
        const studentName = student.name;
        
        tbody.innerHTML = ''; 
        for (const [subject, gradesStr] of Object.entries(student.grades)) {
            const tr = document.createElement('tr');
            
            const tdSubject = document.createElement('td');
            tdSubject.textContent = subject;
            
            const tdGrades = document.createElement('td');
            if (gradesStr && gradesStr.trim() !== "") {
                tdGrades.innerHTML = `<span class="grade">${gradesStr.replace(/,/g, ' • ')}</span>`;
            } else {
                tdGrades.innerHTML = `<span class="empty">нет оценок</span>`;
            }

            const tdAvg = document.createElement('td');
            if (gradesStr && gradesStr.trim() !== "") {
                const gradesArray = gradesStr.split(',').map(g => parseFloat(g.trim())).filter(g => !isNaN(g));
                if (gradesArray.length > 0) {
                    const sum = gradesArray.reduce((a, b) => a + b, 0);
                    const avg = (sum / gradesArray.length).toFixed(1);
                    tdAvg.textContent = avg;
                } else {
                    tdAvg.innerHTML = `<span class="empty">—</span>`;
                }
            } else {
                tdAvg.innerHTML = `<span class="empty">—</span>`;
            }

            tr.appendChild(tdSubject);
            tr.appendChild(tdGrades);
            tr.appendChild(tdAvg);
            tbody.appendChild(tr);
        }

        renderAbsences(studentName, absenceMonthSelect.value);
    });

    absenceMonthSelect.addEventListener('change', function() {
        const selectedIndex = select.value;
        if (selectedIndex !== "") {
            const studentName = studentsData[selectedIndex].name;
            renderAbsences(studentName, this.value);
        }
    });

    function switchTab(tabName) {
        if (tabName === 'grades') {
            btnGrades.classList.add('active');
            btnAbsences.classList.remove('active');
            sectionGrades.style.display = 'block';
            sectionAbsences.style.display = 'none';
        } else if (tabName === 'absences') {
            btnAbsences.classList.add('active');
            btnGrades.classList.remove('active');
            sectionAbsences.style.display = 'block';
            sectionGrades.style.display = 'none';
            
            const selectedIndex = select.value;
            if (selectedIndex !== "") {
                const studentName = studentsData[selectedIndex].name;
                renderAbsences(studentName, absenceMonthSelect.value);
            }
        }
    }

    btnGrades.addEventListener('click', () => switchTab('grades'));
    btnAbsences.addEventListener('click', () => switchTab('absences'));

</script>
